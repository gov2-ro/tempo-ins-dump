<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locuri — INS+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/explore.css?v=48">
    <script>
        (function(){
            var t=localStorage.getItem('lens_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
            document.documentElement.setAttribute('data-theme',t);
        })();
    </script>
    <style>
        .places-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .place-chip {
            display: inline-block;
            padding: 0.4rem 0.9rem;
            background: var(--bg-3);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.875rem;
            transition: border-color 0.15s, background 0.15s;
        }
        .place-chip:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
            color: var(--text-0);
        }
        .place-chip.hidden { display: none; }

        /* Inline search bar */
        .places-search-wrap {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .places-search-input {
            width: 100%;
            max-width: 420px;
            height: 40px;
            padding: 0 12px 0 38px;
            border-radius: var(--radius, 10px);
            border: 1px solid var(--border);
            background: var(--bg-2);
            color: var(--text-0);
            font-family: var(--font, Inter, sans-serif);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .places-search-input:focus { border-color: var(--accent); }
        .places-search-input::placeholder { color: var(--text-2); }
        .places-search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-2);
        }

        .section-header {
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin: 1.5rem 0 0.75rem;
        }
        .section-header.hidden { display: none; }
        .section-note { color: var(--text-muted); font-size: 0.8rem; margin: 0.6rem 0 0; }
        .place-chip .chip-sub { color: var(--text-muted); font-size: 0.75rem; margin-left: 0.35rem; }
    </style>
    <link rel="stylesheet" href="/css/ui-rhythm.css?v=5">
    <script src="/js/ui-preferences.js?v=4" defer></script>
</head>
<body>
    <nav class="topbar" id="topbar" data-active="places" data-own="theme lang"></nav>

    <div class="main-content" style="max-width:900px;margin:0 auto;padding:2rem 1rem;">
        <h1 id="page-title" style="font-size:1.6rem;font-weight:700;margin-bottom:0.25rem;">Profiluri de locuri</h1>
        <p id="page-subtitle" style="color:var(--text-muted);margin-bottom:1.5rem;">Orașe mari, județe, regiuni de dezvoltare și macroregiuni din România</p>

        <div class="places-search-wrap">
            <svg class="places-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="places-search" class="places-search-input" placeholder="Caută oraș, județ sau regiune..." autocomplete="off">
        </div>

        <div id="places-loading" style="color:var(--text-muted);">Se încarcă...</div>
        <div id="places-content" style="display:none;">
            <section id="section-featured">
                <h2 id="label-featured" class="section-header">Orașe mari</h2>
                <div id="grid-featured" class="places-grid"></div>
                <p id="note-featured" class="section-note"></p>
            </section>
            <section id="section-county">
                <h2 id="label-county" class="section-header">Județe</h2>
                <div id="grid-county" class="places-grid"></div>
            </section>
            <section id="section-region">
                <h2 id="label-region" class="section-header">Regiuni de dezvoltare</h2>
                <div id="grid-region" class="places-grid"></div>
            </section>
            <section id="section-macroregion">
                <h2 id="label-macroregion" class="section-header">Macroregiuni</h2>
                <div id="grid-macroregion" class="places-grid"></div>
            </section>
        </div>
    </div>

    <script src="/js/config.js?v=1"></script>

    <script src="/js/utils.js?v=33"></script>
    <script src="/js/api.js?v=31"></script>
    <script src="/js/site-chrome.js?v=6"></script>

    <script src="/js/places-page.js?v=3"></script>
</body>
</html>
