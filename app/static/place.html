<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil loc — INS+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/explore.css?v=37">
    <script>
        (function(){
            var t=localStorage.getItem('lens_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
            document.documentElement.setAttribute('data-theme',t);
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        .place-header { padding:1.5rem 0 1rem; border-bottom:1px solid var(--border); margin-bottom:1.5rem; }
        .breadcrumb { font-size:0.8rem; color:var(--text-muted); margin-bottom:0.5rem; }
        .breadcrumb a { color:var(--text-muted); text-decoration:none; }
        .breadcrumb a:hover { color:var(--text-primary); }
        .place-title { font-size:1.8rem; font-weight:700; display:flex; align-items:center; gap:0.75rem; }
        .geo-badge {
            font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;
            padding:0.2rem 0.6rem; border-radius:10px;
            background:var(--bg-3); color:var(--text-muted); border:1px solid var(--border);
        }
        .dataset-count { font-size:0.85rem; color:var(--text-muted); margin-top:0.4rem; }

        /* KPI Heroes */
        .kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:0.75rem; margin-bottom:2rem; }
        .kpi-card {
            background:var(--bg-3); border:1px solid var(--border);
            border-radius:8px; padding:0.875rem; cursor:pointer; transition:border-color 0.15s;
        }
        .kpi-card:hover, .kpi-card.active { border-color:var(--accent); }
        .kpi-label { font-size:0.75rem; color:var(--text-muted); margin-bottom:0.3rem; }
        .kpi-value { font-size:1.2rem; font-weight:700; color:var(--text-primary); }
        .kpi-unit { font-size:0.75rem; color:var(--text-muted); margin-left:0.2rem; }
        .kpi-delta { font-size:0.75rem; margin-top:0.15rem; }
        .kpi-delta.up { color:var(--green); }
        .kpi-delta.down { color:var(--red); }
        .kpi-sparkline { height:32px; margin-top:0.4rem; }

        /* Theme Sections */
        .section-title {
            font-size:0.875rem; font-weight:600; text-transform:uppercase;
            letter-spacing:0.05em; color:var(--text-muted); margin:1.5rem 0 0.75rem;
        }
        .indicator-grid { display:flex; flex-direction:column; gap:0.75rem; }
        .theme-section { border:1px solid var(--border); border-radius:8px; overflow:hidden; }
        .theme-header { display:flex; align-items:center; gap:0.6rem; padding:0.75rem 1rem; cursor:pointer; background:var(--bg-3); transition:background 0.1s; }
        .theme-header:hover { background:var(--bg-hover); }
        .theme-icon { font-size:1.1rem; }
        .theme-label { font-weight:600; font-size:0.9rem; color:var(--text-primary); flex:1; }
        .theme-count { font-size:0.75rem; color:var(--text-muted); background:var(--border); padding:0.1rem 0.5rem; border-radius:10px; }
        .theme-chevron { font-size:0.7rem; color:var(--text-muted); transition:transform 0.15s; }
        .theme-charts { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--border); }
        .mini-chart-cell { padding:0.75rem; border-right:1px solid var(--border); background:var(--bg-2); }
        .mini-chart-cell:last-child { border-right:none; }
        .mini-chart-title { font-size:0.7rem; color:var(--text-muted); margin-bottom:0.25rem; }
        .mini-chart-canvas { height:60px; }
        .mini-chart-stat { font-size:0.9rem; font-weight:600; color:var(--text-primary); margin-top:0.2rem; }
        .theme-accordion { border-top:1px solid var(--border); }
        .theme-accordion.hidden { display:none; }
        .accordion-item { display:flex; align-items:center; gap:0.75rem; padding:0.5rem 1rem; text-decoration:none; border-bottom:1px solid var(--border); color:var(--text-primary); transition:background 0.1s; }
        .accordion-item:hover { background:var(--bg-hover); }
        .accordion-item:last-child { border-bottom:none; }
        .acc-title { flex:1; font-size:0.8rem; line-height:1.3; }
        .acc-code { font-size:0.7rem; color:var(--text-muted); font-family:monospace; white-space:nowrap; }

        /* Comparison */
        .comparison-section { margin-top:2rem; }
        .always-chips { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.75rem; }
        .baseline-chip {
            padding:0.3rem 0.8rem; border-radius:12px; font-size:0.8rem;
            border:1px solid var(--border); color:var(--text-muted); background:var(--bg-3);
        }
        .peer-groups { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem; }
        .peer-group { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
        .peer-group-label { font-size:0.75rem; color:var(--text-muted); min-width:90px; }
        .peer-chip {
            padding:0.25rem 0.7rem; border-radius:10px; font-size:0.8rem; cursor:pointer;
            background:var(--bg-3); border:1px solid var(--border); color:var(--text-primary);
            transition:all 0.15s;
        }
        .peer-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        #comparison-chart { width:100%; height:320px; min-height:320px; }

        .page-container { max-width:960px; margin:0 auto; padding:0 1rem 3rem; }
        #place-loading { padding:2rem; color:var(--text-muted); }

        /* Topbar place search */
        .topbar-place-wrap {
            position:relative;
            flex:0 1 300px;
        }
        .topbar-place-input {
            width:100%;
            height:36px;
            padding:0 12px 0 34px;
            border-radius:var(--radius-sm,6px);
            border:1px solid var(--border);
            background:var(--bg-2);
            color:var(--text-0);
            font-family:var(--font,Inter,sans-serif);
            font-size:13px;
            outline:none;
            transition:border-color 0.2s;
        }
        .topbar-place-input:focus { border-color:var(--accent); }
        .topbar-place-input::placeholder { color:var(--text-2); }
        .topbar-place-icon {
            position:absolute;
            left:10px;
            top:50%;
            transform:translateY(-50%);
            pointer-events:none;
            opacity:0.4;
        }
        .topbar-place-dropdown {
            position:absolute;
            top:calc(100% + 4px);
            left:0;
            right:0;
            background:var(--bg-1);
            border:1px solid var(--border-hover);
            border-radius:var(--radius,10px);
            z-index:200;
            max-height:260px;
            overflow-y:auto;
            box-shadow:var(--shadow-lg);
        }
        .topbar-place-dropdown.hidden { display:none; }
        .topbar-place-item {
            display:flex;
            align-items:center;
            gap:8px;
            padding:8px 12px;
            cursor:pointer;
            text-decoration:none;
            color:var(--text-0);
            font-size:13px;
            border-bottom:1px solid var(--border);
        }
        .topbar-place-item:last-child { border-bottom:none; }
        .topbar-place-item:hover { background:var(--bg-3); }
        .topbar-place-item-type {
            font-size:10px;
            color:var(--text-2);
            background:var(--bg-3);
            padding:1px 5px;
            border-radius:4px;
            white-space:nowrap;
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="topbar-left">
            <a href="/" class="logo"><span class="logo-dot"></span>INS<span style="margin:-1ex 0 0 -1ex;">+</span></a>
        </div>

        <div class="topbar-place-wrap" id="place-nav-wrap">
            <svg class="topbar-place-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="place-nav-input" class="topbar-place-input" placeholder="Caută un loc..." autocomplete="off">
            <div id="place-nav-dropdown" class="topbar-place-dropdown hidden"></div>
        </div>

        <div class="topbar-right">
            <a href="/places" class="toggle-btn" style="text-decoration:none;font-size:0.8rem;padding:0 10px;">Locuri</a>
            <a href="/" class="toggle-btn" style="text-decoration:none;font-size:0.8rem;padding:0 10px;">Date</a>
            <button class="toggle-btn" id="theme-toggle" title="Schimbă tema">
                <svg id="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg id="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="toggle-btn lang-toggle" id="lang-toggle" title="Schimbă limba">
                <span id="lang-label">EN</span>
            </button>
        </div>
    </nav>

    <div class="page-container">
        <div id="place-loading">Se încarcă...</div>
        <div id="place-content" style="display:none;">
            <!-- Section A: Header + KPI heroes -->
            <div class="place-header">
                <div class="breadcrumb" id="breadcrumb"></div>
                <div class="place-title">
                    <span id="place-name"></span>
                    <span class="geo-badge" id="geo-badge"></span>
                </div>
                <div class="dataset-count" id="dataset-count"></div>
            </div>
            <div class="kpi-grid" id="kpi-grid"></div>

            <!-- Section B: Themed Sections -->
            <div class="section-title" id="section-title-themes">Seturi de date pe teme</div>
            <div class="indicator-grid" id="indicator-grid"></div>

            <!-- Section C: Comparison -->
            <div class="comparison-section">
                <div class="section-title">Comparație — <span id="comparison-kpi-label" style="color:var(--text-primary)"></span></div>
                <div class="always-chips" id="always-chips"></div>
                <div class="peer-groups" id="peer-groups"></div>
                <div id="comparison-chart"></div>
            </div>
        </div>
    </div>

    <script src="/js/place-page.js?v=3"></script>
</body>
</html>
