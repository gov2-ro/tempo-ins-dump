<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INS+ — Comparație</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/explore.css?v=48">
    <link rel="stylesheet" href="/css/dashboard-v2.css?v=13">
    <script>
        // Apply saved theme before first paint to avoid flash
        (function() {
            const t = localStorage.getItem('lens_theme')
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        .cmp-recipe { margin-top: 8px; }
        .cmp-recipe h1 { font-size: 1.35rem; margin: 0 0 6px; }
        .cmp-recipe .rcp-def { max-width: 90ch; font-size: 13px; color: var(--text-1); line-height: 1.5; margin: 0 0 6px; }
        .cmp-recipe .rcp-status { font-size: 12px; color: var(--warning, #b45309); margin: 0 0 10px; }
        .rcp-controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0 12px; font-size: 13px; }
        .rcp-controls select { padding: 6px 8px; font: inherit; background: var(--bg-2); color: var(--text-0); border: 1px solid var(--border); border-radius: 6px; min-height: 36px; }
        .rcp-controls a, .rcp-controls button { font: inherit; font-size: 13px; }
        .rcp-btn { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-1); color: var(--text-0); cursor: pointer; text-decoration: none; }
        .rcp-btn.primary { border-color: var(--accent); color: var(--accent); }
        .rcp-table-wrap { overflow-x: auto; }
        .rcp-table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
        .rcp-table th, .rcp-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
        .rcp-table th:nth-child(2), .rcp-table td:nth-child(2) { text-align: left; }
        .rcp-meta { font-size: 12px; color: var(--text-2); margin: 8px 0; }
        .rcp-meta a { color: var(--accent); }
        .rcp-excluded { font-size: 12px; color: var(--warning, #b45309); }
        #rcp-chart { height: 760px; flex: none; }
        @media (max-width: 640px) { #rcp-chart { height: 900px; } }
    </style>
    <link rel="stylesheet" href="/css/ui-rhythm.css?v=5">
    <script src="/js/ui-preferences.js?v=4" defer></script>
</head>
<body class="dbv2-body">
    <!-- Top bar: rendered by js/site-chrome.js -->
    <nav class="topbar" id="topbar" data-active="data">
        <button class="sidebar-toggle" id="sidebar-toggle" data-slot="left" title="Quick navigate" aria-label="Quick navigate" aria-controls="lens-sidebar" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </nav>

    <!-- Search overlay -->
    <div class="search-overlay hidden" id="search-overlay">
        <div class="search-backdrop" id="search-backdrop"></div>
        <div class="search-modal">
            <div class="search-input-row">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" placeholder="Caută seturi de date, indicatori, coduri..." spellcheck="false">
                <kbd>esc</kbd>
            </div>
            <div id="search-results" class="search-results"></div>
            <div class="search-footer">
                <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span>
                <span><kbd>&crarr;</kbd> open</span>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="lens-sidebar hidden" id="lens-sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title" id="sidebar-title">Navighează</span>
            <button class="sidebar-close" id="sidebar-close">&times;</button>
        </div>
        <div class="sidebar-search">
            <input type="text" id="sidebar-search-input" placeholder="Filtrează seturile..." spellcheck="false" autocomplete="off">
        </div>
        <div id="sidebar-tree" class="sidebar-tree"></div>
    </aside>

    <main class="dbv2-main">
        <div id="cmp-loader" class="dbv2-loader">Se încarcă…</div>
        <div id="cmp-error" class="dbv2-error hidden"></div>
        <header class="dash-header" id="cmp-header"></header>
        <section class="dbv2-tile cmp-section hidden" id="cmp-line">
            <div class="dbv2-tile-bar">
                <span class="dbv2-tile-title" id="cmp-line-title"></span>
            </div>
            <div class="dbv2-tile-chart cmp-chart" id="cmp-line-chart"></div>
        </section>
        <div class="dbv2-notice hidden" id="cmp-notice"></div>
        <section class="cmp-recipe hidden" id="cmp-recipe" aria-live="polite"></section>
        <section class="dbv2-tile cmp-section hidden" id="cmp-scatter">
            <div class="dbv2-tile-bar">
                <span class="dbv2-tile-title" id="cmp-scatter-title"></span>
                <span class="dbv2-chip" id="cmp-scatter-sub"></span>
            </div>
            <div class="dbv2-tile-chart cmp-chart" id="cmp-scatter-chart"></div>
        </section>
    </main>

    <script src="/js/config.js?v=1"></script>
    <script src="/js/utils.js?v=33"></script>
    <script src="/js/api.js?v=31"></script>
    <script src="/js/site-chrome.js?v=5"></script>
    <script src="/js/echarts-theme.js?v=1"></script>
    <script src="/js/compare.js?v=6"></script>
</body>
</html>
