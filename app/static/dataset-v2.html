<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32">
    <title>INS+ — Dashboard v2</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/explore.css?v=48">
    <link rel="stylesheet" href="/css/dashboard-v2.css?v=13">
    <script>
        // Apply saved theme before first paint to avoid flash
        (function() {
            const t = localStorage.getItem('lens_theme')
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="/css/ui-rhythm.css?v=5">
    <script src="/js/ui-preferences.js?v=4" defer></script>
</head>
<body class="dbv2-body">
    <!-- Top bar: rendered by js/site-chrome.js -->
    <nav class="topbar" id="topbar" data-active="data">
        <button class="sidebar-toggle" id="sidebar-toggle" data-slot="left" title="Quick navigate" aria-label="Quick navigate" aria-controls="lens-sidebar" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </nav>

    <!-- Search overlay -->
    <div class="search-overlay hidden" id="search-overlay">
        <div class="search-backdrop" id="search-backdrop"></div>
        <div class="search-modal">
            <div class="search-input-row">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" placeholder="Caută seturi de date, indicatori, coduri..." spellcheck="false">
                <kbd>esc</kbd>
            </div>
            <div id="search-results" class="search-results"></div>
            <div class="search-footer">
                <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span>
                <span><kbd>&crarr;</kbd> open</span>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="lens-sidebar hidden" id="lens-sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title" id="sidebar-title">Navighează</span>
            <button class="sidebar-close" id="sidebar-close" aria-label="Close">&times;</button>
        </div>
        <div class="sidebar-search">
            <input type="text" id="sidebar-search-input" placeholder="Filtrează seturile..." spellcheck="false" autocomplete="off">
        </div>
        <div id="sidebar-tree" class="sidebar-tree"></div>
    </aside>

    <main class="dbv2-main">
        <div id="dbv2-loader" class="dbv2-loader">Se încarcă…</div>
        <div id="dbv2-error" class="dbv2-error hidden"></div>
        <header class="dash-header" id="dbv2-header"></header>
        <div class="dbv2-kpis hidden" id="dbv2-kpis"></div>
        <div class="dbv2-notice hidden" id="dbv2-notice"></div>
        <div class="dbv2-sentences hidden" id="dbv2-sentences"></div>
        <div class="dbv2-grid hidden" id="dbv2-grid"></div>
        <section class="dbv2-table hidden" id="dbv2-table">
            <div class="dbv2-table-bar">
                <span id="dbv2-table-count"></span>
            </div>
            <div class="dbv2-table-filters" id="dbv2-table-filters"></div>
            <div class="dbv2-table-wrap" id="dbv2-table-wrap"></div>
        </section>
        <section class="dbv2-related hidden" id="dbv2-related"></section>
    </main>

    <script src="/js/config.js?v=1"></script>
    <script src="/js/utils.js?v=33"></script>
    <script src="/js/api.js?v=31"></script>
    <script src="/js/site-chrome.js?v=6"></script>
    <script src="/js/echarts-theme.js?v=3"></script>
    <script src="/js/chart-factory.js?v=37"></script>
    <script src="/js/chart-new-types.js?v=36"></script>
    <script src="/js/chart-geo.js?v=23"></script>
    <script src="/js/chart-demographic.js?v=26"></script>
    <script src="/js/chart-annotations.js?v=1"></script>
    <script src="/js/dashboard-v2.js?v=37"></script>
</body>
</html>
