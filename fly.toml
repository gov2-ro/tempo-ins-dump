# fly.toml app configuration file generated for tempo-ins-explorer on 2026-04-04T12:30:13+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tempo-ins-explorer'
primary_region = 'ams'

[build]

# [env] holds the code's safe defaults (release-check.py smokes the image with exactly these). The
# production profile (public MCP, own-key Ask, content logs) is set with `fly secrets`, from
# scripts/deploy/fly/mcp-public.env; unset a secret to switch that feature off again.
[env]
  TEMPO_DATA_DIR = '/app/data'
  TEMPO_DEBUG = 'false'

# Content logs (TEMPO_ASK_LOG_DIR=/logs) must survive redeploys: a 1 GB volume, so one machine.
[mounts]
  source = 'tempo_logs'
  destination = '/logs'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1          # MCP clients time out on a cold start

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
