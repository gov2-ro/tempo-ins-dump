name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Synthetic tests only: no corpus, no secrets, no deploy. Tests marked
    # `corpus` are SKIPPED here (a skip is not a pass); they need a validated
    # artifact and belong in a separate data job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Install DuckDB FTS extension (needed by FTS fixture tests)
        run: python -c "import duckdb; duckdb.connect().execute('INSTALL fts')"
      - name: Synthetic tests
        run: python -m pytest tests -q -rs
